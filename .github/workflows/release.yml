name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full test suite
        shell: pwsh
        run: python tests/run_all.py

      - name: Build AntigravityStudio.exe
        shell: cmd
        run: desktop\build_desktop_app.bat

      - name: Package release zip & SHA256SUMS.txt
        id: pkg
        shell: pwsh
        run: |
          $ver = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          powershell -NoProfile -ExecutionPolicy Bypass -File desktop\package_release.ps1 -Version $ver
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AntigravityStudio-*-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Upload Release Artifact (manual workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityStudio-${{ steps.pkg.outputs.version }}-win-x64
          path: |
            dist/AntigravityStudio-*-win-x64.zip
            dist/SHA256SUMS.txt
