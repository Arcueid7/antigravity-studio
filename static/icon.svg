    <rect x="30" y="34" width="196" height="190" fill="url(#agGreenGlow)" />
    <rect x="30" y="34" width="196" height="190" fill="url(#agYellowGlow)" />
    <rect x="30" y="34" width="196" height="190" fill="url(#agRedGlow)" />
    <rect x="30" y="34" width="196" height="190" fill="url(#agBlueCore)" />
