  <!-- Pure white rounded squircle matching Antigravity desktop icon -->
  <rect x="10" y="10" width="236" height="236" rx="56" fill="#FFFFFF" />
  <rect x="11.5" y="11.5" width="233" height="233" rx="54.5" stroke="#000000" stroke-opacity="0.06" stroke-width="3" />
  <!-- Multicolor flowing Antigravity 'A' arch -->
  <g clip-path="url(#agIconArchClip)">
