<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <clipPath id="agIconArchClip">
      <path d="M 128 44
               C 146 44, 159 67, 173 114
               C 185 154, 197 183, 211 198
               C 219 206, 214 216, 202 214
               C 187 212, 176 194, 165 173
               C 153 149, 142 137, 128 137
               C 114 137, 103 149, 91 173
               C 80 194, 69 212, 54 214
               C 42 216, 37 206, 45 198
               C 59 183, 71 154, 83 114
               C 97 67, 110 44, 128 44 Z" />
    </clipPath>
    <linearGradient id="agBaseBlue" x1="128" y1="40" x2="128" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A8DF8" />
      <stop offset="55%" stop-color="#357DF6" />
      <stop offset="100%" stop-color="#2268EA" />
    </linearGradient>
    <radialGradient id="agGreenGlow" cx="84" cy="100" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34A853" stop-opacity="1" />
      <stop offset="48%" stop-color="#34A853" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#34A853" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="agYellowGlow" cx="112" cy="54" r="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBC04" stop-opacity="1" />
      <stop offset="46%" stop-color="#F9AB00" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="agRedGlow" cx="152" cy="70" r="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="1" />
      <stop offset="48%" stop-color="#EA4335" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="agBlueCore" cx="128" cy="144" r="76" gradientUnits="userSpaceOnUse">
